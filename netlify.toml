[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://esm.sh; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/admin"
  to = "/#dashboard"
  status = 302

[[redirects]]
  from = "/client"
  to = "/#dashboard"
  status = 302

[[redirects]]
  from = "/db/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/drizzle.config.ts"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BACKUP_POINT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.netlify/results.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.netlify/db/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.netlify/functions-serve/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.netlify/state.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.netlify/features/*"
  to = "/404.html"
  status = 404
  force = true
